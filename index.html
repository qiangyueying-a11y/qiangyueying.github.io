<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yueying Qiang</title>
    <style>
        :root {
            --bg-color: #fcfaf7;
            --card-bg: #ffffff;
            --text-main: #333230;
            --text-muted: #7a7672;
            --accent-color: #8c7662;
            --border-color: #eee9e0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.8;
            margin: 0;
            padding: 20px 20px 60px;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
        }

        /* 顶栏导航 */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border-color);
        }

        .nav-logo a {
            font-weight: 600;
            font-size: 1.2rem;
            color: var(--accent-color);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 18px;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--accent-color);
            font-weight: 600;
        }

        /* 极简 About 区块 */
        .about-header {
            margin-bottom: 25px;
        }

        .about-header h1 {
            font-size: 1.8rem;
            color: var(--accent-color);
            margin: 0 0 8px 0;
            font-weight: 600;
        }

        .about-header p {
            color: var(--text-muted);
            font-size: 1rem;
            margin: 0;
        }

        .about-content {
            background: var(--card-bg);
            padding: 32px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.02);
            font-size: 1.05rem;
            color: var(--text-main);
        }

        .about-content p {
            margin-top: 0;
            margin-bottom: 18px;
        }

        .about-content p:last-child {
            margin-bottom: 0;
        }

        footer {
            margin-top: 60px;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 导航栏 -->
        <nav>
            <div class="nav-logo"><a href="index.html">Yueying Qiang</a></div>
            <ul class="nav-links">
                <li><a href="index.html" class="active">About</a></li>
                <li><a href="publications.html">Publications</a></li>
                <li><a href="cv.html">CV</a></li>
                <li><a href="diary.html">Diary</a></li>
                <li><a href="tea.html">Tea</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>

        <!-- 极简 About 主体 -->
        <div class="about-header">
            <h1>About Me</h1>
            <p>Welcome to my personal digital space.</p>
        </div>

        <div class="about-content">
            <p>这里留给你写自己的介绍！直接在这段文字的位置替换成你想写的任意内容即可。</p>
            
            <p>如果你想分段，就多复制几个这样子带 <code>&lt;p&gt;</code> 的段落标签，每一段都会有优雅舒适的行间距。</p>
        </div>

        <footer>
            © 2026 Yueying Qiang. All rights reserved.
        </footer>
    </div>

</body>
</html>
